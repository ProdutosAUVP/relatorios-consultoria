# Publica a ferramenta de preenchimento em GitHub Pages.
#
# O site é gerado a partir dos modelos, não commitado à mão: o job roda o
# gerador e o indexador antes de publicar, então a ferramenta nunca fica
# atrasada em relação a `gerador/`. Para ligar, em Settings > Pages escolha
# Source: GitHub Actions.
name: Publicar ferramenta

on:
  push:
    branches: [main]
    paths:
      - 'gerador/**'
      - 'docs/**'
      - 'scripts/catalogo.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar modelos e índice
        run: |
          python3 gerador/build.py
          node scripts/catalogo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
